<!--
  The NextBSD cube, the source asset for the boot splash (E19).

  Taken from the hero logo of nextbsd.org (nextbsd/nextbsd.github.io
  index.html, svg.logo-cube, commit 7290e10), without the soft ground
  shadow and cropped to the cube (viewBox 40 40 320 360), as in the E19
  quiet-console mockups. gen-bootsplash.py rasterises it into the loader's
  PNGs and the kernel's compiled-in copy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 320 360">
  <defs>
    <linearGradient id="face-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a5a64"/>
      <stop offset="100%" stop-color="#33333a"/>
    </linearGradient>
    <linearGradient id="face-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#16161b"/>
    </linearGradient>
    <linearGradient id="face-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#42424c"/>
      <stop offset="100%" stop-color="#26262d"/>
    </linearGradient>
    <linearGradient id="edge-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cube body: top + left + right faces (isometric) -->
  <polygon points="200,60 340,140 200,220 60,140"   fill="url(#face-top)"   stroke="#6a6a76" stroke-width="1"/>
  <polygon points="60,140 200,220 200,380 60,300"   fill="url(#face-left)"  stroke="#44444e" stroke-width="1"/>
  <polygon points="340,140 200,220 200,380 340,300" fill="url(#face-right)" stroke="#55555f" stroke-width="1"/>

  <!-- crisp upper-edge highlights -->
  <line x1="200" y1="60"  x2="340" y2="140" stroke="url(#edge-highlight)" stroke-width="1.5"/>
  <line x1="200" y1="60"  x2="60"  y2="140" stroke="url(#edge-highlight)" stroke-width="1.5"/>
  <line x1="200" y1="60"  x2="200" y2="220" stroke="url(#edge-highlight)" stroke-width="1.5"/>
</svg>
