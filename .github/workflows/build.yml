name: Build NextBSD Kernel
on:
  repository_dispatch:
    types: [toolchain-updated]
  push:
    # main only: a PR branch is built by its pull_request run, and a push run
    # on the same branch was a second, identical build (nextbsd-kernel#324).
    branches: [main]
    paths: ['patches/**', 'config/**', 'src-overlay/**', 'ci/**', '.github/workflows/build.yml']
  pull_request:
    # Validate the kernel build on PRs touching patches/config/workflow. PR
    # runs never cascade — the module-build trigger is gated on
    # github.event_name == 'repository_dispatch', which a pull_request is not.
    paths: ['patches/**', 'config/**', 'src-overlay/**', 'ci/**', '.github/workflows/build.yml']
  workflow_dispatch:

# One run per PR: a new push cancels the PR's previous run. Runs on main are
# never cancelled, since they publish `continuous`; they queue instead. Chain
# runs (repository_dispatch) get their own group, so a merge queued behind one
# can't replace it and drop its kernel-updated dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && 'chain' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FREEBSD_BRANCH: releng/15.1

jobs:
  kernel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Per-arch toolchain image. repository_dispatch carries fbsd_sha (the
      # pinned source commit) -> :<arch>-fbsd-<sha>; a patch-only push or manual
      # run has no sha and falls back to :<arch>-latest. Both arches cross-build
      # on the x86_64 runner (clang cross-compiles; no emulation).
      image: ghcr.io/nextbsd/nextbsd-toolchain:${{ matrix.target }}-${{ github.event.client_payload.fbsd_sha && format('fbsd-{0}', github.event.client_payload.fbsd_sha) || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # migcom (built for the build host) and the MIG wire types; see the MIG
      # section of ci/prepare-src.sh.
      - name: Checkout nextbsd-userland (migcom + wire types)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-userland
          ref: main
          path: .userland

      # All source preparation: patches/series, the NextBSD identity, the
      # regenerated syscall tables, config/NEXTBSD (and NEXTBSD-RPI5 on arm64),
      # src-overlay/ with its sys/conf wiring (Mach, IOKit catalogue and
      # registry, linuxkpi_video, vfs.pivot, kernel events, the Linuxulator),
      # and the generated MIG servers. One script, so the kext builds run
      # exactly the same steps at the nextbsd-kernel commit they build
      # against (#325).
      - name: Prepare source (ci/prepare-src.sh)
        run: |
          "$GITHUB_WORKSPACE/ci/prepare-src.sh" "${{ matrix.target }}" "${{ matrix.target_arch }}" \
            "$GITHUB_WORKSPACE/.userland" /usr/src

      # msgh_id is subsystem base + index, so a misplaced or omitted `skip;`
      # silently renumbers every routine after it and the kernel then executes
      # the WRONG FUNCTION for a given message -- no error, no crash. Nothing
      # else catches that, so the ABI contract is checked on every build.
      - name: Verify MIG ABI against the frozen contract
        run: |
          set -eu
          # mach_port is GENERATED, so this checks the generator's output.
          "$GITHUB_WORKSPACE/ci/verify-mig-abi.sh" \
            /usr/src/sys/compat/mach/mach_port_server.c \
            "$GITHUB_WORKSPACE/src-overlay/sys/sys/mach/mach_port.msgids"

          # All of these are GENERATED now as well (#125), so this checks the
          # generator's output for every subsystem -- there is no frozen server
          # left in the build. Pinning the contract against the servers actually
          # being built is what stops a bad `skip;` or a renumbering from
          # landing unnoticed.
          for sub in task vm_map host_priv mach_host mach_vm clock; do
            "$GITHUB_WORKSPACE/ci/verify-mig-abi.sh" \
              "/usr/src/sys/compat/mach/${sub}_server.c" \
              "$GITHUB_WORKSPACE/src-overlay/sys/sys/mach/${sub}.msgids"
          done

      - name: Build kernel (no modules)
        run: |
          cd /usr/src
          # --cross-bindir points at the external Clang 19 cross toolchain
          # (CROSS_BINDIR), inherited from the toolchain image ENV.
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            KERNCONF=NEXTBSD \
            NO_MODULES=yes \
            buildkernel -j"$(nproc)"

      # Gate: the Linuxulator and FUSE must be COMPILED INTO the kernel, on
      # BOTH arches (#60 follow-up). NextBSD ships no /boot/kernel .ko tree and
      # no kld tooling, so "compiled in" is the only state in which either one
      # exists at all -- there is no runtime fallback that could mask a config
      # regression. Nothing checked this before, which is how arm64 ended up
      # silently without the Linux ABI while amd64 had it.
      #
      # Two layers, because they fail differently:
      #   1. the .o files prove config(8) SELECTED the entries (a files.* or
      #      options wiring mistake drops them here, with the kernel still
      #      linking fine),
      #   2. the symbols prove they actually LINKED IN (an `optional' entry that
      #      no option selects compiles nothing and leaves no trace otherwise).
      #
      # Deliberately a build-time gate, not a runtime one: CI has no arm64 boot
      # today, so a runtime probe could not be arch-symmetric. This one is.
      - name: Gate — Linuxulator + FUSEFS are compiled into the kernel
        run: |
          set -eu
          OBJ="/usr/obj/usr/src/${{ matrix.target }}.${{ matrix.target_arch }}/sys/NEXTBSD"
          test -d "$OBJ" || { echo "no kernel obj dir at $OBJ" >&2; exit 1; }
          NM="${CROSS_BINDIR}/llvm-nm"; [ -x "$NM" ] || NM=nm
          fail=0
          echo "--- objects config(8) should have selected (${{ matrix.target }})"
          for o in linux_sysvec.o linux_machdep.o linux_misc.o linux_elf64.o \
                   linprocfs.o linsysfs.o fuse_vfsops.o fuse_vnops.o; do
            if [ -f "$OBJ/$o" ]; then echo "  ok    $o"
            else echo "  MISSING $o" >&2; fail=1; fi
          done
          echo "--- symbols that must be in the linked kernel"
          for s in elf_linux_sysvec fuse_vfsops; do
            if "$NM" "$OBJ/kernel" 2>/dev/null | grep -qw "$s"; then
              echo "  ok    $s"
            else echo "  MISSING symbol $s" >&2; fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "The Linuxulator and/or FUSE are NOT in this kernel." >&2
            echo "amd64 wires the ABI via src-overlay/conf/files.compat_linux;" >&2
            echo "arm64 needs the arm64 equivalent (sys/arm64/linux/)." >&2
            exit 1
          fi
          echo "==> Linuxulator + FUSEFS compiled in (${{ matrix.target }})"

      # arm64 only: build the Pi 500+ bring-up kernel and wrap it in the arm64
      # Linux `Image` boot header, so the Raspberry Pi firmware can load it
      # directly -- no loader, no UEFI. This is the nextbsd-rpi500 native-boot
      # path (route (a)): the firmware parses the header, copies the payload to
      # 0x200000 and enters at EL2 with x0 = physical FDT.
      #
      # A separate KERNCONF rather than options on NEXTBSD, because config/NEXTBSD
      # is copied to BOTH sys/amd64/conf and sys/arm64/conf -- SOCDEV_PA there
      # would break the amd64 build, and pointing an early console at an address
      # that does not exist on other arm64 targets (the test VM) is worse than
      # having no early console at all.
      #
      # Nothing below is new code; FreeBSD already ships every piece:
      #   sys/conf/Makefile.arm64           the kernel.bin target (strip + prepend)
      #   sys/tools/arm_kernel_boothdr.awk  write_v8booti(), magic 0x644d5241
      #   sys/arm64/conf/std.arm64          LINUX_BOOT_ABI, already in GENERIC
      #   sys/arm64/arm64/locore.S          maps SOCDEV_PA, sets socdev_va
      - name: Build NEXTBSD-RPI5 + kernel.bin (arm64 booti image)
        if: matrix.target == 'arm64'
        run: |
          cd /usr/src
          # NEXTBSD-RPI5 and rpi5.env were laid in by ci/prepare-src.sh.
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=arm64 TARGET_ARCH=aarch64 \
            KERNCONF=NEXTBSD-RPI5 \
            NO_MODULES=yes \
            buildkernel -j"$(nproc)"
          KO=$(cd /usr/obj && find . -type d -path '*sys/NEXTBSD-RPI5' | head -1)
          KO=${KO#./}
          test -n "$KO" || { echo "no sys/NEXTBSD-RPI5 obj dir" >&2; exit 1; }
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=arm64 TARGET_ARCH=aarch64 \
            KERNCONF=NEXTBSD-RPI5 \
            NO_MODULES=yes \
            buildenv BUILDENV_SHELL="make -C /usr/obj/$KO kernel.bin"
          ls -lh "/usr/obj/$KO/kernel.bin"
          # Prove the header is there rather than trusting the exit code: the
          # arm64 Image magic 0x644d5241 sits at offset 56, little-endian,
          # i.e. the bytes 41 52 4d 64 ("ARM\x64"). A headerless image would
          # be refused by the firmware and look exactly like a dead board.
          MAGIC=$(od -An -tx1 -j56 -N4 "/usr/obj/$KO/kernel.bin" | tr -d ' \n')
          echo "Image_header magic @56: $MAGIC"
          test "$MAGIC" = "41524d64" || { echo "BAD or MISSING arm64 Image header" >&2; exit 1; }
          # Prove the early console is actually compiled in, for the same
          # reason: a kernel without it boots and says nothing. config(8)
          # writes both options into opt_global.h (sys/conf/options.arm64 for
          # SOCDEV_PA, sys/conf/options for EARLY_PRINTF), so that file is the
          # authoritative evidence that the config was accepted -- checking the
          # config file we just wrote would only prove we can read our own input.
          OG="/usr/obj/$KO/opt_global.h"
          test -f "$OG" || { echo "no opt_global.h at $OG" >&2; exit 1; }
          grep -qE '^#define[[:space:]]+SOCDEV_PA[[:space:]]' "$OG" \
            || { echo "SOCDEV_PA absent from opt_global.h -- config(8) did not take it" >&2; exit 1; }
          grep -qE '^#define[[:space:]]+EARLY_PRINTF[[:space:]]' "$OG" \
            || { echo "EARLY_PRINTF absent from opt_global.h" >&2; exit 1; }
          echo "opt_global.h says:"
          grep -E '^#define[[:space:]]+(SOCDEV_PA|EARLY_PRINTF)[[:space:]]' "$OG" | sed 's/^/  /'

          # Corroborate against the linked kernel. NEXTBSD sets no
          # `makeoptions DEBUG=-g`, so there is no kernel.full -- only kernel.
          # Do NOT hide nm's stderr: a missing tool or file must not be
          # indistinguishable from a missing symbol, which is exactly how the
          # first version of this check produced a false failure.
          KELF="/usr/obj/$KO/kernel.full"
          [ -f "$KELF" ] || KELF="/usr/obj/$KO/kernel"
          NM="${CROSS_BINDIR}/llvm-nm"
          [ -x "$NM" ] || NM="$(command -v llvm-nm || command -v nm || true)"
          if [ -n "$NM" ] && [ -f "$KELF" ]; then
            if "$NM" "$KELF" | grep -q ' socdev_va'; then
              echo "socdev_va present in $(basename "$KELF"): early console linked in"
            else
              echo "socdev_va NOT in $(basename "$KELF") despite opt_global.h" >&2; exit 1
            fi
          else
            echo "note: no nm ($NM) or no kernel ELF ($KELF); opt_global.h check stands alone"
          fi
          mkdir -p /tmp/rpi5 && cp "/usr/obj/$KO/kernel.bin" /tmp/rpi5/kernel8.img

      - name: Upload kernel8.img (arm64 booti image)
        if: matrix.target == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-kernel8-arm64
          path: /tmp/rpi5/kernel8.img

      # Tar the obj tree IN-CONTAINER, where /usr/obj perms are intact. The
      # exec bit (bmake, cross-tools) survives inside the tar stream; a raw
      # upload-artifact tree comes back 0644 and breaks make.py's bmake
      # bootstrap downstream (PermissionError on /usr/obj/bmake-install/bin/bmake).
      # KERNEL-BUILD-ID names this exact kernel build: the commit, plus the run
      # and attempt, because NextBSD patches the kernel and the same commit
      # rebuilt (new toolchain, new attempt) is a different binary as far as
      # struct layouts go -- __FreeBSD_version can't tell them apart
      # (nextbsd-kernel#326, nextbsd-kernel-extensions#46). Both arches and
      # NEXTBSD-RPI5 share one ID, since they come from one run and one tree.
      # It lives in the obj dir, so it rides in BOTH tarballs below at
      # .../sys/NEXTBSD/KERNEL-BUILD-ID: the kext builds read it from
      # kernel-obj and stamp it into every kext tarball; packaging and the
      # image lanes compare the two and refuse a mismatch.
      - name: Stamp KERNEL-BUILD-ID
        run: |
          set -eu
          OBJ="/usr/obj/usr/src/${{ matrix.target }}.${{ matrix.target_arch }}/sys/NEXTBSD"
          test -f "$OBJ/kernel" || { echo "no kernel at $OBJ" >&2; exit 1; }
          echo "${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}" > "$OBJ/KERNEL-BUILD-ID"
          echo "KERNEL-BUILD-ID: $(cat "$OBJ/KERNEL-BUILD-ID")"

      - name: Package obj tree (preserves exec bits)
        run: |
          # Full /usr/obj — consumed by nextbsd-kernel-extensions.
          tar -czf "/tmp/kernel-obj-${{ matrix.target }}.tar.gz" -C /usr/obj .
          # sys/NEXTBSD subtree (kernel binary + opt_*.h) — consumed by nextbsd.
          SUB=$(cd /usr/obj && find . -type d -path '*sys/NEXTBSD' | head -1)
          echo "sys/NEXTBSD subtree: ${SUB:-<not found>}"
          test -n "$SUB"
          tar -czf "/tmp/nextbsd-kernel-${{ matrix.target }}.tar.gz" -C /usr/obj "$SUB"
          ls -lh /tmp/kernel-obj-${{ matrix.target }}.tar.gz /tmp/nextbsd-kernel-${{ matrix.target }}.tar.gz

      # Artifacts are now single .tar.gz files (already gzip'd → store-only).
      # Their CONTENTS carry the perms, so the round-trip through artifacts +
      # the continuous release no longer strips the exec bit.
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-kernel-${{ matrix.target }}
          path: /tmp/nextbsd-kernel-${{ matrix.target }}.tar.gz
          compression-level: 0

      - name: Upload obj tree for modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-obj-${{ matrix.target }}
          path: /tmp/kernel-obj-${{ matrix.target }}.tar.gz
          compression-level: 0

      # --- Native image assembly (nextbsd#369) ---
      # Assemble a bootable disk.img HERE, in the toolchain container (which has
      # /usr/src + $CROSS_BINDIR to host-build makefs/mkimg), from THIS build's
      # kernel + the component `continuous` artifacts — exactly like
      # nextbsd-userland does. This replaces the old "download the published ISO
      # and inject the kernel in a FreeBSD VM" path, so the kernel CI no longer
      # depends on the ISO (which depends on nextbsd-pkg). The image is uploaded
      # for the separate KVM boot job. amd64 only for now (no arm64 boot job).
      - name: Checkout shared assembly + boot harness (nextbsd-ci, pinned)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: v0.3.5
          path: nextbsd-ci

      - name: Assemble disk.img (this kernel + component continuous artifacts)
        if: github.event_name == 'pull_request'
        env:
          # This step only READS public `continuous` release assets from the
          # sibling component repos, so it needs no PAT — the built-in,
          # auto-injected GITHUB_TOKEN authenticates gh for public cross-repo
          # reads. Using it (not secrets.DISPATCH_TOKEN) is what lets PRs from
          # forks build: fork PRs never receive repo secrets, but they do get a
          # read-only github.token. The PAT stays only on the cross-repo
          # repository_dispatch step below, which forks can never trigger.
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.target }}
          KERNEL_TGZ: /tmp/nextbsd-kernel-${{ matrix.target }}.tar.gz
          WORK: ${{ github.workspace }}/nbimg
        run: |
          set -eu
          mkdir -p art
          # base rootfs (compat), the Darwin userland layer, and driver kexts —
          # each from its own `continuous` release; the kernel is THIS build's.
          gh release download continuous -R nextbsd/nextbsd-freebsd-compat \
            --pattern 'nextbsd-base-${{ matrix.target }}.tar.gz' --dir art --clobber
          gh release download continuous -R nextbsd/nextbsd-userland \
            --pattern 'nextbsd-userland-${{ matrix.target }}.tar.gz' --dir art --clobber
          # Third-party base programs (zsh, sudo, pico) live in nextbsd-contrib by
          # the repo boundary rule, so none of the above ships them. Without it the
          # image has no /bin/zsh -- the login shell the overlay's master.passwd
          # gives admin -- and the serial reads "login: /bin/zsh: No such file or
          # directory" in a getty loop, which the login gate below then reports as
          # a kernel boot regression.
          gh release download continuous -R nextbsd/nextbsd-contrib \
            --pattern 'nextbsd-contrib-${{ matrix.target }}.tar.gz' --dir art --clobber
          # The kext assets are a mix of arch-suffixed (graphics-kexts-amd64,
          # graphics-kexts-arm64) and unsuffixed (intelwifi-kext, nvidia-kexts)
          # names, and '*kext*.tar.gz' matches every one of them -- so before
          # arm64 assembled anything, an amd64 image was being built with the
          # arm64 graphics kexts laid in alongside its own. Harmless there
          # (wrong-arch .ko files simply never load) but wrong, and actively
          # wrong once both arches assemble. Drop the other arch's suffixed
          # assets after download.
          #
          # And on arm64 drop the UNSUFFIXED ones too. They are amd64 -- the
          # legacy graphics-kexts.tar.gz, intelwifi-kext, nvidia-kexts -- and
          # `ls` orders "graphics-kexts.tar.gz" AFTER "graphics-kexts-arm64.tar.gz"
          # ('-' 0x2d sorts before '.' 0x2e), so the amd64 bundle was extracted
          # last and laid x86-64 objects over arm64's own. kldload then reported
          #
          #   linker_load_file: /System/Library/Extensions/DMABuf.kext/Contents/\
          #       MacOS/DMABuf - unsupported file type
          #
          # and the whole graphics chain never loaded, so nothing on arm64 could
          # ever exercise VirtIOGraphics. This is the same defect
          # nextbsd-userland fixed in 64422f0 ("arm64 has never run its own
          # kexts"); this repo kept the half of it that only drops the other
          # arch's SUFFIXED assets. Keeping the unsuffixed ones on amd64 is
          # correct -- there they are that arch's assets.
          gh release download continuous -R nextbsd/nextbsd-kernel-extensions \
            --pattern '*kext*.tar.gz' --dir art --clobber || true
          _other=amd64; [ "${{ matrix.target }}" = amd64 ] && _other=arm64
          rm -f art/*-"$_other".tar.gz
          if [ "${{ matrix.target }}" != amd64 ]; then
            for _k in art/*kext*.tar.gz; do
              [ -e "$_k" ] || continue
              case "$_k" in
                *-"${{ matrix.target }}".tar.gz) ;;
                *) echo "dropping non-arm64 kext asset $_k"; rm -f "$_k" ;;
              esac
            done
          fi
          export BASE_TGZ="$PWD/art/nextbsd-base-${{ matrix.target }}.tar.gz"
          export USERLAND_TGZ="$PWD/art/nextbsd-userland-${{ matrix.target }}.tar.gz"
          export CONTRIB_TGZ="$PWD/art/nextbsd-contrib-${{ matrix.target }}.tar.gz"
          export MODULES_TGZ="$(ls art/*kext*.tar.gz 2>/dev/null | tr '\n' ' ')"
          # pkg-free /etc seed from nextbsd-overlays (no git in container), same
          # as nextbsd-userland's assembly step.
          gh api repos/nextbsd/nextbsd-overlays/tarball/main > /tmp/overlays.tar.gz
          mkdir -p "$WORK/seed"
          tar -C "$WORK/seed" --strip-components=1 -xzf /tmp/overlays.tar.gz
          export SEED_ROOTFS="$WORK/seed/rootfs"
          # The SHARED assembly (nextbsd-ci, pinned above) replaces this repo's
          # vendored ci/ copy (nextbsd#376): one recipe for every consumer.
          sh nextbsd-ci/scripts/assemble-image.sh

      - name: Upload native-assembled image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-ci-image-${{ matrix.target }}
          path: nbimg/out/disk.img

  # PR-only boot smoke test: boot the disk.img the build job self-assembled from
  # THIS kernel + the component `continuous` artifacts (nextbsd#369). No ISO, no
  # nextbsd-pkg, no FreeBSD VM — the kernel CI holds its own, the way
  # nextbsd-userland does. The trap/Mach code under test compiles INTO the base
  # kernel (options COMPAT_MACH), so the freshly-built kernel in this image
  # carries it.
  #
  # Deliberately scoped: runs ONLY on pull_request, never on main/dispatch, and
  # does NOT gate `publish` or the downstream cascade. amd64 only (no arm64 boot
  # job yet).
  smoke-test:
    name: smoke-test (boot the self-assembled image with this kernel)
    needs: kernel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The image (~2G raw) + qemu need headroom.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # The bootable image the build job self-assembled from THIS kernel + the
      # component `continuous` artifacts. No ISO, no FreeBSD VM, no kernel
      # injection — the freshly-built kernel is already the one in the image.
      - name: Download the self-assembled image
        uses: actions/download-artifact@v4
        with:
          name: nextbsd-ci-image-amd64
          path: .

      - name: Install qemu + expect + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 expect ovmf

      # The shared nextbsd-ci boot harness, pinned to the lockstep release tag
      # (v0.3.5). Replaces the dead nextbsd monolith fetch (its old org is
      # gone; the URL 404s) AND the main-tracking drift in one move. The
      # harness is modular (boot-test.sh + patterns.tcl + the *.exp.inc loader/
      # login/teardown contract + the marker manifest), so it is checked out as a
      # tree, not curled file-by-file.
      - name: Checkout nextbsd-ci shared boot harness (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: v0.3.5
          path: nextbsd-ci

      # A KERNEL smoke-test gates on "does THIS kernel boot" (reached login), NOT
      # on the flaky post-login userland markers (#369; userland's own CI runs
      # them non-gating for the same reason). NB_LOGIN_ONLY=1: the harness boots
      # -> logs in -> confirms a clean end-state -> powers off, and runs NO on-image
      # suite (the kernel image ships no sentinel suite). It also skips the marker
      # absence check (the kernel image runs no suite), so a clean login+poweroff
      # is exit 0. The harness writes its transcript to boot-test.log.
      - name: Boot test (this kernel, self-assembled image)
        id: boottest
        continue-on-error: true
        env:
          ARCH: amd64
          NB_LOGIN_ONLY: '1'
        run: |
          set +e
          sh nextbsd-ci/harness/boot-test.sh disk.img
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      # Gate on the harness exit class, not a hand-rolled serial grep. The harness's
      # own login detection (login.exp.inc) reaches the same "this kernel booted to
      # a console session" conclusion the old grep did, and it also catches the #428
      # class the grep could not (a login that holds for a moment, then the system
      # resets: end-state lost, exit 2). Login-only runs no suite, so a non-zero rc
      # is a real kernel regression (panic / never-reached-login / lost end-state),
      # not a flaky post-login userland marker.
      - name: Gate — kernel booted clean (harness exit class)
        if: always() && steps.boottest.outputs.rc != '0'
        run: |
          echo "BOOT-GATE-FAIL: this kernel did not boot clean (harness rc=${{ steps.boottest.outputs.rc }})." >&2
          echo "  rc 2 = never reached login / end-state lost; rc 1 = a kernel panic." >&2
          echo "  See the uploaded serial transcript (boot-test.log)." >&2
          exit 1

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot-test.log
          if-no-files-found: ignore

  # arm64 counterpart of the job above. Same contract: boot the disk.img the
  # build job self-assembled from THIS kernel, gate on reaching the getty login
  # prompt, never gate `publish`.
  #
  # On the shared nextbsd-ci harness @v0.3.5 (pinned tag) like the amd64 sibling
  # above -- the T4 lockstep now covers BOTH arches. NB_LOGIN_ONLY=1: the kernel
  # image ships no sentinel suite, so the harness boots -> logs in -> confirms a
  # clean end-state -> powers off, and the gate is the harness exit class. The
  # shared harness's login detection probes for a shell (NB-SHELL-READY), which
  # fixes the old self-contained expect's autologin->shell 30-min hang.
  #
  # Runs on a native arm64 runner (free for public repos), so qemu is not
  # cross-emulating; the harness picks the arm64 machine (virt) + firmware.
  #
  # NEXTBSD-RPI5 is deliberately NOT what boots here: qemu has no BCM2712
  # machine model. This is the generic arm64 NEXTBSD kernel on -M virt under
  # UEFI, which is the same shape as the published NextBSD-arm64 image.
  smoke-test-arm64:
    name: smoke-test-arm64 (boot the self-assembled arm64 image)
    needs: kernel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Download the self-assembled arm64 image
        uses: actions/download-artifact@v4
        with:
          name: nextbsd-ci-image-arm64
          path: .

      - name: Install qemu + expect + AAVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 expect

      # The shared nextbsd-ci harness, pinned tag: the arm64 machine (virt),
      # the firmware, the loader un-mute, the login/shell detection (with the
      # NB-SHELL-READY probe the old self-contained expect lacked -- the fix for
      # the autologin->shell 30-min hang), and the teardown all come from one
      # place now. NB_LOGIN_ONLY: the kernel image ships no sentinel suite, so
      # the harness boots -> logs in -> confirms a clean end-state -> powers off;
      # the exit class is the gate. (The old self-contained expect's
      # VT/virtio-gpu->drmfb console-handover arm is dropped with it; it is a
      # nice-to-have, not the boot gate, and the shared harness lacks it.)
      - name: Checkout nextbsd-ci shared boot harness (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: v0.3.5
          path: nextbsd-ci

      - name: Boot test (this kernel, self-assembled arm64 image)
        id: boottest
        continue-on-error: true
        env:
          ARCH: arm64
          NB_LOGIN_ONLY: '1'
        run: |
          set +e
          sh nextbsd-ci/harness/boot-test.sh disk.img
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # Gate on the harness exit class (same as the amd64 sibling): exit 0 =
      # reached login + clean end-state; exit 2 = never booted to login (the
      # hang/panic class); exit 1 = a kernel panic. The harness writes its
      # transcript to boot-test.log, uploaded below.
      - name: Gate — kernel booted clean (harness exit class)
        if: always() && steps.boottest.outputs.rc != '0'
        run: |
          echo "BOOT-GATE-FAIL: this arm64 kernel did not boot clean (harness rc=${{ steps.boottest.outputs.rc }})." >&2
          echo "  rc 2 = never reached login / end-state lost; rc 1 = a kernel panic." >&2
          echo "  See the uploaded serial transcript (boot-test.log)." >&2
          exit 1

      - name: Upload arm64 boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-arm64
          path: boot-test.log
          if-no-files-found: ignore

  # Refresh the rolling `continuous` release from a successful main build, so
  # downstream consumers ingest a stable, always-present pointer instead of
  # scraping "latest successful main run" artifacts (which expire and aren't
  # gated). PRs build (the job above) but never reach here — see the `if`.
  # Single non-matrix job (not a per-arch step) so the two legs don't race on
  # release creation; it collects both arches' artifacts and publishes once.
  publish:
    name: publish continuous
    needs: kernel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The build job already produced perms-correct .tar.gz files (one per
      # artifact); just gather them. No re-tar — re-taring the extracted tree
      # is exactly what stripped the exec bit before.
      - name: Collect per-arch assets
        run: |
          mkdir -p out
          find artifacts -name 'kernel-obj-*.tar.gz' -exec cp {} out/ \;
          find artifacts -name 'nextbsd-kernel-*.tar.gz' -exec cp {} out/ \;
          # The Pi 5 family board kernel, published under a name that says what
          # it is: kernel.bin wrapped in an arm64 Linux Image header, which the
          # BCM2712 bootloader loads directly as kernel8.img. It is NOT a
          # tarball and NOT interchangeable with nextbsd-kernel-arm64.tar.gz
          # (that ships an ELF the Pi firmware will not enter).
          #
          # One kernel, many boards -- NEXTBSD-RPI5 has nothing board-specific
          # in it. The IMAGES built from it stay per-board, because a boot
          # partition carries one board's DTB: nextbsd's BOARD=rpi500 lane puts
          # bcm2712-rpi-500.dtb next to this exact file, and a Pi 5 B lane
          # would put bcm2712-rpi-5-b.dtb next to the very same one.
          find artifacts -name 'kernel8.img' -exec cp {} out/rpi5-kernel8-arm64.img \;
          # Transition alias under the old name, so an nextbsd checkout that
          # has not yet moved to rpi5-kernel8-arm64.img keeps building. Delete
          # once nextbsd#414 and its follow-up have landed.
          cp out/rpi5-kernel8-arm64.img out/rpi500-kernel8-arm64.img
          # One KERNEL-BUILD-ID for the whole run, also as its own asset so a
          # consumer can check it without downloading a tarball. Each kernel
          # tarball must carry that same ID (kernel-obj is packed from the same
          # obj dir in the same step, and is too big to re-read here).
          ID="${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}"
          echo "$ID" > out/KERNEL-BUILD-ID
          for t in out/nextbsd-kernel-*.tar.gz; do
            f=$(tar -tzf "$t" | grep -m1 'sys/NEXTBSD/KERNEL-BUILD-ID$') \
              || { echo "FAIL: $t carries no KERNEL-BUILD-ID" >&2; exit 1; }
            got=$(tar -xzOf "$t" "$f")
            [ "$got" = "$ID" ] || { echo "FAIL: $t has KERNEL-BUILD-ID $got, expected $ID" >&2; exit 1; }
            echo "  $(basename "$t"): $got"
          done
          ls -lh out/

      # Stable asset names (no datestamp) → each publish overwrites in place, so
      # the release never accumulates stale assets and needs no delete step.
      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous kernel build
          body: |
            Rolling kernel build, refreshed on every successful `main` build.
            Consumed by nextbsd-kernel-extensions (`kernel-obj-<arch>.tar.gz`) and
            nextbsd (`nextbsd-kernel-<arch>.tar.gz`, plus
            `rpi5-kernel8-arm64.img` for the Raspberry Pi 5 family image lanes;
            `rpi500-kernel8-arm64.img` is a transition alias for the same
            file).

            KERNEL-BUILD-ID: `${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}`
            (also the `KERNEL-BUILD-ID` asset, and `.../sys/NEXTBSD/KERNEL-BUILD-ID`
            in every tarball). Kexts built against this kernel carry the same ID.

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/KERNEL-BUILD-ID
            out/*.tar.gz
            out/rpi5-kernel8-arm64.img
            out/rpi500-kernel8-arm64.img

      # Cascade to modules only when this run is part of the chain
      # (repository_dispatch: an upstream freebsd-src change, or a manual
      # full-chain run started from freebsd-src's sync-fork.yml with `force`),
      # and only AFTER continuous is refreshed above, so the module build
      # ingests this run's obj tree, not the prior one. A merge to main does
      # NOT rebuild the kexts (nextbsd-kernel#324): they stay stale until the
      # chain runs, and the KERNEL-BUILD-ID check (#326) makes packaging and
      # images refuse the mismatched pair.
      - name: Trigger module build
        if: github.event_name == 'repository_dispatch'
        run: |
          gh api repos/nextbsd/nextbsd-kernel-extensions/dispatches \
            -f event_type=kernel-updated \
            -f "client_payload[fbsd_sha]=${{ github.event.client_payload.fbsd_sha }}" \
            -f "client_payload[sha]=${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
